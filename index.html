<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicHub</title>
    <link rel="stylesheet" href="output.css">
</head>

<body class="bg-black/95 text-white">
    <section>
        <section id="hero" class="border-b border-zinc-500">
            <div class="flex justify-between items-center mr-5 m-3">
                <div class="flex text-2xl">
                    <svg xmlns="http://www.w3.org/2000/svg"
                        class="flex items-center bg-red-600 rounded-lg p-2"
                        width="50" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                        <path d="M3 17a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" />
                        <path d="M13 17a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" />
                        <path d="M9 17v-13h10v13" />
                        <path d="M9 8h10" />
                    </svg>

                    <p class="font-bold flex items-center">
                        Music<span class="text-red-600">Hub</span>
                    </p>
                </div>

                <div class="text-red-600">
                    <svg xmlns="http://www.w3.org/2000/svg"
                        width="34" height="34" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                        <path d="M10 5a2 2 0 1 1 4 0a7 7 0 0 1 4 6v3a4 4 0 0 0 2 3h-16a4 4 0 0 0 2 -3v-3a7 7 0 0 1 4 -6" />
                        <path d="M9 17v1a3 3 0 0 0 6 0v-1" />
                    </svg>
                </div>
            </div>
        </section>

        <section class="flex flex-col items-center mt-20 text-4xl font-extrabold">
            <p class="text-red-600">Listen &amp; Enjoy...</p>
            <p>Your favorites Songs</p>
        </section>

        <section>
            <form class="mt-10 flex justify-center p-3 gap-2" action="">
                <input
                    class="p-3 border rounded-lg  text-red-600"
                    id="inputBtn"
                    type="text"
                    placeholder="Search Songs">

                <button id="searchBtn"
                    class="bg-red-600 p-3 rounded-lg font-extrabold">
                    Search
                </button>
            </form>
        </section>

        <section>
            <div class="flex flex-col">
                <div id="songContainer">
                    <!-- Song cards JavaScript se yahan render honge -->
                </div>

                <div id="playerControls" class="hidden p-4">
                    <p id="currentSong">No song playing</p>

                    <div class="flex items-center gap-3">
                        <span id="currentTime">0:00</span>

                        <input
                            type="range"
                            id="progressBar"
                            min="0"
                            max="100"
                            value="0"
                            class="w-full accent-red-500">

                        <span id="duration">0:00</span>
                    </div>
                </div>
            </div>
        </section>
    </section>

    <script src="scrpit.js"></script>
</body>

</html>
